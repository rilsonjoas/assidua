name: Deploy VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # ── Web (W1, 2026-08-22): build da SPA no runner + publicação no
      # VPS antes do rebuild dos containers. API_URL de produção é
      # embutida aqui via env — NUNCA confiar no .env local.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build web (expo export)
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: https://api-remedios.narniano.com/api
        run: |
          npm ci --legacy-peer-deps
          npx expo export --platform web

      # Achado 2026-08-22 (deploy #27/#28): drone-scp RE-EMPACOTA tudo
      # num tar próprio e extrai preservando o caminho de origem — um
      # tar manual + caminho absoluto em /tmp fez o arquivo ir para
      # /tmp/tmp/... e o diretório da web ficou VAZIO (nginx 403).
      # Padrão correto: apontar source pro diretório dentro do workspace,
      # strip_components pra achatar, target direto no destino final.
      - name: Publicar web no VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "app/dist/"
          target: /opt/meus-remedios/web
          strip_components: 2

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Achado 2026-08-22: sem set -e, o tar que falhava em silêncio
            # deixava o deploy "verde" com site vazio. Falhar ALTO sempre.
            set -e
            test -f /opt/meus-remedios/web/index.html || {
              echo "ERRO: index.html não chegou ao VPS — scp falhou?" >&2
              exit 1
            }
            cd /opt/meus-remedios
            git pull --ff-only origin main

            # ── Drift check de ambiente (2026-08-22): variável nova no
            # .env.example TEM que existir no .env real do VPS antes de
            # qualquer deploy. Pega "esqueci a variável" no CI, não em
            # produção com usuário na mão.
            cd api
            MISSING=""
            while IFS='=' read -r key _; do
              case "$key" in ''|\#*) continue ;; esac
              grep -q "^${key}=" .env || MISSING="$MISSING $key"
            done < .env.example
            if [ -n "$MISSING" ]; then
              echo "" >&2
              echo "🛑 DEPLOY BLOQUEADO — variáveis novas no .env.example ausentes no .env do VPS:$MISSING" >&2
              echo "   No VPS: adicione-as em /opt/meus-remedios/api/.env e" >&2
              echo "   recrie o container (--force-recreate) — up -d --build NÃO relê env_file." >&2
              exit 1
            fi

            # ── Recria a API se o CONTEÚDO do .env mudou desde o último
            # deploy (up -d --build não relê env_file — achado já
            # documentado no README do hetzner-infra).
            ENV_HASH=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .env | sort | sha256sum | cut -d' ' -f1)
            if [ ! -f .env.deployed ] || [ "$(cat .env.deployed)" != "$ENV_HASH" ]; then
              echo ".env mudou → recriando remedios-api para reler env_file..."
              docker compose -f ~/hetzner-infra/meus-remedios/docker-compose.yml \
                --env-file ~/hetzner-infra/.env up -d --force-recreate remedios-api
              echo "$ENV_HASH" > .env.deployed
            fi

            # Achado do primeiro deploy web (2026-08-22): o repo de infra
            # usa branch MASTER (não main) — puxar 'origin main' falhava,
            # o '|| true' engolia, o compose ficava sem o remedios-web e
            # o smoke test quebrava. Sem '|| true': infra desatualizada
            # tem que QUEBRAR o deploy, não passar despercebida.
            cd ~/hetzner-infra
            git pull --ff-only origin master
            make deploy service=meus-remedios

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://api-remedios.narniano.com/ && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://meusremedios.narniano.com/ && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
