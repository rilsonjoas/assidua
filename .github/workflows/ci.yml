name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: API (Testes, Composer Audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none

      - name: Instalar dependências
        working-directory: api
        run: composer install --prefer-dist --no-progress

      - name: Preparar ambiente de teste
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Composer audit
        working-directory: api
        run: composer audit

      - name: Testes (PHPUnit — usa SQLite em memória, ver phpunit.xml)
        working-directory: api
        run: php artisan test

      - name: Valida build de produção (--no-dev)
        working-directory: api
        run: |
          rm -rf vendor
          composer install --no-dev --optimize-autoloader --no-interaction
        # Achado real em 2026-08-08: config/scribe.php commitado usava
        # classe de um pacote require-dev, quebrando silenciosamente
        # 'composer install --no-dev' — só apareceu no build de deploy,
        # depois de já commitado. Esse passo pega isso na CI, antes.

  mobile:
    name: Mobile (Testes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit

      - name: Testes (Jest + React Native Testing Library)
        working-directory: app
        run: npm test

  docker-api:
    name: Build & Push API
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/assidua-api
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
