; Achado real de uso (2026-09-06, APK novo): upload de foto de
; medicamento voltava erro 500 do servidor. Causa: `php:8.4-fpm-alpine`
; vem com upload_max_filesize=2M de fábrica, nunca sobrescrito aqui —
; mas MedicationController valida `photo` com `max:5120` (5MB). PHP
; truncava o upload ANTES do Laravel processar, e o código de
; conversão WebP quebrava numa imagem incompleta. post_max_size fica
; acima do upload_max_filesize (multipart tem overhead de campos
; extras); memory_limit (128M, ver Dockerfile) já é bem maior que os
; dois, sem risco de faltar memória pra processar a imagem com GD.
upload_max_filesize = 8M
post_max_size = 10M
